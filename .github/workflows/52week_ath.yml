name: 52W-ATH Scan

on:
  workflow_dispatch:   # cronjob.org yahin se trigger karega

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pandas requests
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Run scan
        run: python 52week_ath_scan.py

      - name: Commit CSV (replace)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/52w_ath_scan.csv
          git diff --cached --quiet || git commit -m "Scan update $(date -u +%F)"
          git push