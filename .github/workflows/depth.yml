name: depth

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 3-10 * * 1-5"   # market hours (UTC). Agar external trigger use karte ho to ye 2 lines hata do

concurrency:
  group: depth
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Get depth CSVs from private repo
        uses: actions/checkout@v4
        with:
          repository: anshu4rky4/SectorGainer_kotak
          token: ${{ secrets.OTHER_REPO_PAT }}
          path: depthsrc
          sparse-checkout: depth_data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build depth JSON
        run: python build_depth.py

      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/depth
          git diff --cached --quiet || (git commit -m "depth $(date -u +%H:%M)" && git pull --rebase && git push)