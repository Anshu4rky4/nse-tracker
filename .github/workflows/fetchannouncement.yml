name: fetch-announcements
on:
  workflow_dispatch:      # sirf manual: Actions tab -> Run workflow
concurrency:
  group: fetch-announcements
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_announcements.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit announcements json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/ann
          if ! git diff --cached --quiet; then
            git commit -m "announcements $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi